<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!-- アプリとして使うので、ピンチやダブルタップでの拡大はさせない (iPhone はこの指定だけでは止まらないので、styles.css と main.tsx でも止めている) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ecf0ed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hachi" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Hachi</title>
    <script>
      // 端末のダークモードには追従しない。設定で選んだテーマを、描画前に反映する (src/lib/appearance.ts)
      // auto (季節に合わせる) の決まりと、テーマごとの地の色は、appearance.ts の seasonTheme / THEMES と同じもの
      try {
        var t = localStorage.getItem('theme')
        if (t === 'auto') {
          var now = new Date(), m = now.getMonth() + 1, d = now.getDate()
          t = m === 10 && d >= 25 ? 'halloween' : m === 12 && d >= 15 && d <= 25 ? 'christmas' : m >= 3 && m <= 5 ? 'spring' : m >= 6 && m <= 8 ? 'summer' : m >= 9 && m <= 11 ? 'autumn' : 'winter'
        }
        var bg = { dark: '#121212', leaf: '#d3ead0', spring: '#f7d6df', summer: '#cbe7f4', autumn: '#f3d9b8', winter: '#d5dfef', halloween: '#f8d09a', christmas: '#d0e4ce' }[t]
        if (bg) {
          document.documentElement.dataset.theme = t
          document.querySelector('meta[name="theme-color"]').content = bg
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
